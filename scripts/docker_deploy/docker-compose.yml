version: '3.8'

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: sw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: simple_website
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./upload:/upload
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sw_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
    volumes:
      - ./upload:/app/upload
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/simple_website?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: sw_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./upload:/upload:ro

volumes:
  mysql_data:
